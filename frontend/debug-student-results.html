<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Student Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #667eea; }
        .debug-section {
            background: #f7fafc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .student-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-item {
            background: #f7fafc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5a67d8;
        }
        pre {
            background: #2d3748;
            color: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Student Results Debugger</h1>

    <div class="debug-section">
        <h2>Step 1: Check localStorage</h2>
        <button onclick="checkLocalStorage()">Check for Test Data</button>
        <button onclick="createSampleTest()">Create Sample Test</button>
        <button onclick="clearAllTests()">Clear All Tests</button>
        <div id="localStorageInfo"></div>
    </div>

    <div class="debug-section">
        <h2>Step 2: Test Student Results Display</h2>
        <button onclick="loadAndDisplayStudents()">Load Student Results</button>
        <div id="studentsContainer"></div>
    </div>

    <div class="debug-section">
        <h2>Step 3: Raw Data</h2>
        <button onclick="showRawData()">Show Raw Data</button>
        <div id="rawData"></div>
    </div>

    <script>
        function checkLocalStorage() {
            const output = document.getElementById('localStorageInfo');
            let html = '<h3>localStorage Contents:</h3>';
            
            const tests = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('mathmeg_test_')) {
                    tests.push(key);
                }
            }
            
            if (tests.length === 0) {
                html += '<p style="color: red;">❌ No test results found in localStorage!</p>';
                html += '<p>This is why the student results aren\'t showing.</p>';
            } else {
                html += `<p style="color: green;">✅ Found ${tests.length} test(s):</p><ul>`;
                tests.forEach(key => {
                    const test = JSON.parse(localStorage.getItem(key));
                    html += `<li><strong>${key}</strong><br>Student: ${test.studentName || 'N/A'}<br>Score: ${test.totalScore || 0}</li>`;
                });
                html += '</ul>';
            }
            
            output.innerHTML = html;
        }

        function createSampleTest() {
            const testId = 'test_' + Date.now();
            const sampleTest = {
                id: testId,
                studentName: 'John Doe',
                date: new Date().toISOString(),
                totalScore: 1400,
                readingScore: 700,
                mathScore: 700,
                rwScore: 700,
                duration: 7200,
                expired: false,
                readingAnswers: [
                    { correct: true, studentAnswer: 0, correctAnswer: 0, skill: 'Vocabulary' },
                    { correct: false, studentAnswer: 1, correctAnswer: 2, skill: 'Main Idea' },
                    { correct: true, studentAnswer: 3, correctAnswer: 3, skill: 'Evidence' }
                ],
                mathAnswers: [
                    { correct: true, studentAnswer: 1, correctAnswer: 1, skill: 'Algebra' },
                    { correct: false, studentAnswer: 0, correctAnswer: 2, skill: 'Geometry' },
                    { correct: true, studentAnswer: 2, correctAnswer: 2, skill: 'Data Analysis' }
                ]
            };
            
            localStorage.setItem('mathmeg_test_' + testId, JSON.stringify(sampleTest));
            alert('✅ Sample test created for John Doe!');
            checkLocalStorage();
        }

        function clearAllTests() {
            const tests = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('mathmeg_test_')) {
                    tests.push(key);
                }
            }
            
            tests.forEach(key => localStorage.removeItem(key));
            alert(`Cleared ${tests.length} test(s)`);
            checkLocalStorage();
            document.getElementById('studentsContainer').innerHTML = '';
        }

        function loadAndDisplayStudents() {
            const container = document.getElementById('studentsContainer');
            
            // Get all tests
            const allTests = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('mathmeg_test_')) {
                    try {
                        const test = JSON.parse(localStorage.getItem(key));
                        if (test && !test.expired && test.studentName) {
                            allTests.push(test);
                        }
                    } catch (e) {
                        console.error('Error parsing test:', e);
                    }
                }
            }
            
            if (allTests.length === 0) {
                container.innerHTML = '<p style="color: red;">No student test results found. Click "Create Sample Test" to add one.</p>';
                return;
            }
            
            // Group by student
            const studentGroups = {};
            allTests.forEach(test => {
                if (!studentGroups[test.studentName]) {
                    studentGroups[test.studentName] = [];
                }
                studentGroups[test.studentName].push(test);
            });
            
            // Display
            container.innerHTML = '<h3>Student Results:</h3>';
            Object.keys(studentGroups).sort().forEach(studentName => {
                const tests = studentGroups[studentName].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <h3>${studentName}</h3>
                    <p><strong>${tests.length}</strong> test${tests.length > 1 ? 's' : ''}</p>
                    ${tests.map(test => `
                        <div class="test-item">
                            <strong>Date:</strong> ${new Date(test.date).toLocaleDateString()}<br>
                            <strong>Total Score:</strong> ${test.totalScore || 0}<br>
                            <strong>Reading:</strong> ${test.readingScore || test.rwScore || 0}<br>
                            <strong>Math:</strong> ${test.mathScore || 0}
                        </div>
                    `).join('')}
                `;
                container.appendChild(card);
            });
        }

        function showRawData() {
            const output = document.getElementById('rawData');
            const allData = {};
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('mathmeg_')) {
                    try {
                        allData[key] = JSON.parse(localStorage.getItem(key));
                    } catch (e) {
                        allData[key] = localStorage.getItem(key);
                    }
                }
            }
            
            output.innerHTML = '<pre>' + JSON.stringify(allData, null, 2) + '</pre>';
        }

        // Auto-check on load
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>
